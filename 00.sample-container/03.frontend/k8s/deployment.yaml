# 03.frontend Deployment
# - 정적 파일(HTML/CSS/JS)을 nginx로 서빙하는 컨테이너를 k8s에 배포하기 위한 정의
# - image 값은 docker-push.sh로 올린 이미지 주소로 바꿔서 사용한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    update: bfb61f8b
  name: sk339-frontend
  namespace: class-10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk339-frontend
  template:
    metadata:
      labels:
        app: sk339-frontend
    spec:
      containers:
        - name: frontend
          image: skala-registry.skala-ai.com/class-10/sk339-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
